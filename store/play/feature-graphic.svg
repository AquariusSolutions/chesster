<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.55" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d7f7ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glowV)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- faint checkerboard motif, bottom-right -->
  <g fill="#22d3ee" opacity="0.06">
    <rect x="0" y="0" width="64" height="64"/>
    <rect x="64" y="64" width="64" height="64"/>
    <rect x="960" y="436" width="64" height="64"/>
    <rect x="896" y="372" width="64" height="64"/>
    <rect x="960" y="308" width="64" height="64"/>
  </g>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.6" opacity="0.8"/>
    <circle cx="300" cy="420" r="1.3" opacity="0.6"/>
    <circle cx="210" cy="300" r="1.1" opacity="0.5"/>
    <circle cx="640" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="720" cy="430" r="1.2" opacity="0.6"/>
    <circle cx="500" cy="110" r="1" opacity="0.5"/>
    <circle cx="60" cy="240" r="1.2" opacity="0.6"/>
    <circle cx="430" cy="380" r="1.1" opacity="0.5"/>
  </g>

  <!-- pawn on the right, scaled + moved from 1024 space to ~360px tall -->
  <g transform="translate(720,86) scale(0.36)">
    <!-- shadow -->
    <g transform="translate(0,18)" fill="#02030a" opacity="0.5" filter="url(#soft)">
      <circle cx="512" cy="322" r="128"/>
      <ellipse cx="512" cy="452" rx="112" ry="34"/>
      <path d="M 449 452 C 430 545, 392 640, 360 724 L 664 724 C 632 640, 594 545, 575 452 Z"/>
      <rect x="338" y="712" width="348" height="150" rx="34"/>
    </g>
    <!-- pawn body -->
    <g fill="url(#pawn)">
      <circle cx="512" cy="322" r="128"/>
      <ellipse cx="512" cy="452" rx="112" ry="34"/>
      <path d="M 449 452 C 430 545, 392 640, 360 724 L 664 724 C 632 640, 594 545, 575 452 Z"/>
      <rect x="338" y="712" width="348" height="150" rx="34"/>
    </g>
    <ellipse cx="470" cy="278" rx="46" ry="30" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- wordmark + tagline, left aligned -->
  <text x="72" y="238" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800"
        font-size="104" letter-spacing="-2" fill="url(#word)">Chesster</text>
  <text x="76" y="300" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
        font-size="34" letter-spacing="0.5" fill="#e8ecff" opacity="0.85">Solve. Learn. Master.</text>
  <text x="76" y="352" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="400"
        font-size="24" letter-spacing="0.3" fill="#e8ecff" opacity="0.55">Chess puzzles &amp; solutions, engineered to flow.</text>
</svg>
